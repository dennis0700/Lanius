name: macOS Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  APP_NAME: Lanius
  BIN_NAME: lanius-desktop
  BUNDLE_ID: com.dennis0700.lanius
  TARGET: aarch64-apple-darwin

jobs:
  build-macos-arm64:
    name: Build macOS (Apple Silicon)
    # macos-14+ GitHub-hosted runners are Apple Silicon (M-series) machines.
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m1 '^version' crates/lanius-gui/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release -p lanius-gui --target ${{ env.TARGET }}

      - name: Assemble .app bundle
        run: |
          set -euo pipefail
          APP_DIR="dist/${APP_NAME}.app"
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources"

          cp "target/${TARGET}/release/${BIN_NAME}" "${APP_DIR}/Contents/MacOS/${BIN_NAME}"
          chmod +x "${APP_DIR}/Contents/MacOS/${BIN_NAME}"

          cp crates/lanius-gui/assets/icon.icns "${APP_DIR}/Contents/Resources/icon.icns"

          sed "s/@VERSION@/${{ steps.version.outputs.version }}/g" \
            crates/lanius-gui/packaging/macos/Info.plist \
            > "${APP_DIR}/Contents/Info.plist"

      - name: Ad-hoc code sign
        run: |
          # Ad-hoc signing (no Apple Developer certificate) so the app runs
          # without an "unidentified developer" outright block on Apple
          # Silicon. Users will still need to right-click > Open the first
          # time, or run `xattr -dr com.apple.quarantine`, since the app is
          # not notarized.
          codesign --force --deep --sign - "dist/${APP_NAME}.app"

      - name: Create DMG
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="${APP_NAME}-${VERSION}-arm64.dmg"

          STAGING_DIR=$(mktemp -d)
          cp -R "dist/${APP_NAME}.app" "${STAGING_DIR}/"
          ln -s /Applications "${STAGING_DIR}/Applications"

          hdiutil create -volname "${APP_NAME}" \
            -srcfolder "${STAGING_DIR}" \
            -ov -format UDZO \
            "dist/${DMG_NAME}"

          echo "dmg_path=dist/${DMG_NAME}" >> "$GITHUB_ENV"
          echo "dmg_name=${DMG_NAME}" >> "$GITHUB_ENV"

      # A plain `.app.tar.gz` alongside the DMG, used only by the in-app
      # updater (see crates/lanius-gui/src/updater.rs): it needs a bundle it
      # can extract and swap in without mounting/detaching a disk image.
      # `COPYFILE_DISABLE=1` skips macOS's `._*` AppleDouble sidecar files,
      # which `tar` would otherwise embed for extended attributes/resource
      # forks that don't survive (or matter) after re-extraction.
      - name: Create update archive
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          UPDATE_NAME="${APP_NAME}-${VERSION}-arm64.app.tar.gz"

          COPYFILE_DISABLE=1 tar -C dist -czf "dist/${UPDATE_NAME}" "${APP_NAME}.app"

          echo "update_path=dist/${UPDATE_NAME}" >> "$GITHUB_ENV"
          echo "update_name=${UPDATE_NAME}" >> "$GITHUB_ENV"

      # `lanius-desktop`'s in-app updater refuses to trust a downloaded
      # bundle without a matching minisign `.minisig` signature from
      # RELEASE_PUBLIC_KEY (crates/lanius-core/src/update.rs). The private
      # half of that keypair lives only in the `MINISIGN_SECRET_KEY` repo
      # secret, never in the repo itself.
      - name: Sign update archive
        if: github.ref_type == 'tag'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::warning::MINISIGN_SECRET_KEY is not set; skipping artifact signing. The in-app updater will refuse to install this release."
            exit 0
          fi

          cargo install rsign2 --locked --quiet

          umask 077
          KEY_FILE="${RUNNER_TEMP}/minisign.key"
          printf '%s' "$MINISIGN_SECRET_KEY" > "$KEY_FILE"

          # The trusted comment binds the signature to this exact asset
          # name; `Updater::download_verified` refuses to accept a
          # signature whose comment doesn't match the file being verified.
          rsign sign -W -s "$KEY_FILE" -t "file:${update_name}" -x "${update_path}.minisig" "${update_path}" </dev/null
          rm -f "$KEY_FILE"

          PUBLIC_KEY=$(grep -o 'RELEASE_PUBLIC_KEY: &str = "[^"]*"' crates/lanius-core/src/update.rs | sed -E 's/.*"(.*)"/\1/')
          rsign verify -P "$PUBLIC_KEY" -x "${update_path}.minisig" "${update_path}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.dmg_name }}
          path: |
            ${{ env.dmg_path }}
            ${{ env.update_path }}*

      - name: Upload to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          # The `.app.tar.gz*` glob picks up both the archive and its
          # `.minisig` (or just the archive if signing above was skipped).
          files: |
            ${{ env.dmg_path }}
            ${{ env.update_path }}*
