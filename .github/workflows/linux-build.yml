name: Linux Build (lanius-cli)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  BIN_NAME: lanius

jobs:
  build-linux-musl:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            asset_suffix: linux-arm64
          - target: x86_64-unknown-linux-musl
            asset_suffix: linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.13.0"

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m1 '^version' crates/lanius-cli/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build (musl, static)
        run: cargo zigbuild --release -p lanius-cli --target ${{ matrix.target }}

      - name: Verify static linking
        run: |
          BIN="target/${{ matrix.target }}/release/${BIN_NAME}"
          file "$BIN"
          # `file` reports "statically linked" for a musl-static binary with
          # no dynamic interpreter; fail fast if that ever regresses.
          file "$BIN" | grep -q "statically linked"

      - name: Package artifact
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          NAME="${BIN_NAME}-${VERSION}-${{ matrix.asset_suffix }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${NAME}/"
          cp deploy/systemd/lanius.service "dist/${NAME}/"
          cp deploy/lanius.env.example "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          echo "archive_path=dist/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "archive_name=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      # `lanius update` (see crates/lanius-cli/src/update.rs) refuses to
      # trust a downloaded archive without a matching minisign `.minisig`
      # signature from RELEASE_PUBLIC_KEY (crates/lanius-core/src/update.rs).
      # The private half of that keypair lives only in the
      # `MINISIGN_SECRET_KEY` repo secret, never in the repo itself.
      - name: Sign release artifact
        if: github.ref_type == 'tag'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::warning::MINISIGN_SECRET_KEY is not set; skipping artifact signing. \`lanius update\` will refuse to install this release."
            exit 0
          fi

          cargo install rsign2 --locked --quiet

          ARCHIVE="${{ steps.package.outputs.archive_path }}"
          NAME="${{ steps.package.outputs.archive_name }}"

          umask 077
          KEY_FILE="${RUNNER_TEMP}/minisign.key"
          printf '%s' "$MINISIGN_SECRET_KEY" > "$KEY_FILE"

          # The trusted comment binds the signature to this exact asset
          # name; `Updater::download_verified` refuses to accept a
          # signature whose comment doesn't match the file being verified.
          rsign sign -W -s "$KEY_FILE" -t "file:${NAME}" -x "${ARCHIVE}.minisig" "${ARCHIVE}" </dev/null
          rm -f "$KEY_FILE"

          PUBLIC_KEY=$(grep -o 'RELEASE_PUBLIC_KEY: &str = "[^"]*"' crates/lanius-core/src/update.rs | sed -E 's/.*"(.*)"/\1/')
          rsign verify -P "$PUBLIC_KEY" -x "${ARCHIVE}.minisig" "${ARCHIVE}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_path }}

      - name: Upload to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          # The glob (rather than listing the `.minisig` explicitly) means
          # this step still succeeds if signing above was skipped (no
          # `MINISIGN_SECRET_KEY` configured yet).
          files: ${{ steps.package.outputs.archive_path }}*
