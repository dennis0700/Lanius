name: Linux Build (lanius-cli)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

env:
  BIN_NAME: lanius

jobs:
  build-linux-musl:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            asset_suffix: linux-arm64
          - target: x86_64-unknown-linux-musl
            asset_suffix: linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.13.0"

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m1 '^version' crates/lanius-cli/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build (musl, static)
        run: cargo zigbuild --release -p lanius-cli --target ${{ matrix.target }}

      - name: Verify static linking
        run: |
          BIN="target/${{ matrix.target }}/release/${BIN_NAME}"
          file "$BIN"
          # `file` reports "statically linked" for a musl-static binary with
          # no dynamic interpreter; fail fast if that ever regresses.
          file "$BIN" | grep -q "statically linked"

      - name: Package artifact
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          NAME="${BIN_NAME}-${VERSION}-${{ matrix.asset_suffix }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${NAME}/"
          cp deploy/systemd/lanius.service "dist/${NAME}/"
          cp deploy/lanius.env.example "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          echo "archive_path=dist/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "archive_name=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_path }}

      - name: Upload to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive_path }}
