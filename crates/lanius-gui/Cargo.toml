[package]
name = "lanius-gui"
version = "0.1.1"
description = "Lanius Desktop App (Slint UI)"
license = "AGPL-3.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "lanius-desktop"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18"

[dependencies]
lanius-core = { path = "../lanius-core" }

slint = { version = "1.18", features = ["backend-winit", "renderer-femtovg"] }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
auto-launch = "0.6.0"

arboard = "3.4"
rfd = "0.17.2"
tray-icon = "0.24.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
i-slint-backend-testing = "1.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSRunningApplication", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSThread"] }
