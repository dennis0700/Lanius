[workspace]
members = ["crates/lanius-core", "crates/lanius-cli", "crates/lanius-gui"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8.9", features = ["json"] }
tower = "0.5.2"
tower-http = { version = "0.7.1", features = ["catch-panic", "cors", "trace"] }
hyper = "1.5.2"

reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "stream",
    "socks",
    "rustls",
    "gzip",
] }

serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.135", features = ["preserve_order"] }

rusqlite = { version = "0.40.2", features = ["bundled"] }

sha2 = "0.11.0"
hex = "0.4.3"
base64 = "0.23.1"

tiktoken-rs = "0.12.1"

tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }

dirs = "7.0.0"
dotenvy = "0.15.7"
thiserror = "2.0.11"
anyhow = "1.0.95"
chrono = { version = "0.4.39", features = ["serde"] }
uuid = { version = "1.11.1", features = ["v4"] }
whoami = "2.1.3"
futures = "0.3.31"
futures-util = "0.3.31"
async-stream = "0.3.6"
bytes = "1.9.0"
once_cell = "1.20.2"
regex = "1.11.1"
urlencoding = "2.1.3"
clap = { version = "4.6.7", features = ["derive"] }

semver = "1.0.28"
flate2 = "1.1.10"
tar = "0.4.46"
minisign-verify = "0.3.0"
minisign = "0.10.0"

proptest = "1.6.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "unwind"

[profile.dev]
opt-level = 1
